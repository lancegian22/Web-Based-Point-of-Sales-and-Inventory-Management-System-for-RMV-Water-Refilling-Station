<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMV Water Refilling Station - Edit Confirmation</title>
    <link rel="stylesheet" href="css/edit_confirmation.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="stocks-container">
        <header class="top-nav">
            <div class="nav-left">
                <img src="images/water_logo.png" class="mini-logo" alt="Station Logo">
            </div>
        </header>

        <main class="content-wrapper center-screen-adjustment">
            <div class="status-icon-wrapper">
                <img src="images/edit_confirmation.png" class="success-box-image" alt="Confirm Edit Icon">
            </div>
            
            <h2 class="success-message-text">Are you sure that you want to edit the quantity of this item?</h2>
            
            <div class="button-stack">
                <a href="javascript:void(0);" id="YesButton" class="btn-action btn-yes">YES</a>
                <a href="javascript:void(0);" id="NoButton" class="btn-action btn-no">NO</a>
            </div>
        </main>
    </div>

    <script>
        const YesButton = document.getElementById('YesButton');
        const NoButton = document.getElementById('NoButton');

        YesButton.addEventListener('click', function() {
            const stockKey = sessionStorage.getItem('pending_edit_key');
            const valueToSet = parseInt(sessionStorage.getItem('pending_edit_value'));

            if (stockKey && !isNaN(valueToSet)) {
                let currentStock = JSON.parse(localStorage.getItem('rmv_inventory')) || {};
                currentStock[stockKey] = valueToSet;
                localStorage.setItem('rmv_inventory', JSON.stringify(currentStock));
            }

            sessionStorage.removeItem('pending_edit_key');
            sessionStorage.removeItem('pending_edit_value');
            
            window.location.href = 'quantity_added.html';
        });

        NoButton.addEventListener('click', function() {
            sessionStorage.removeItem('pending_edit_key');
            sessionStorage.removeItem('pending_edit_value');
            
            window.location.href = 'edit_stocks.html';
        });
    </script>
</body>
</html>
