<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMV Water Refilling Station - Edit Stocks</title>
    <link rel="stylesheet" href="../css/edit_stocks.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="stocks-container">
        
        <header class="top-nav">
            <div class="nav-left">
                <button id="BackButton" class="back-link">
                    <svg class="nav-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <img src="../images/water_logo.png" alt="Logo" class="mini-logo">
            </div>
            <button id="HomeButton" class="home-link">
                <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
        </header>

        <div class="content-wrapper" style="position: relative; z-index: 30;">
            <h1 class="dashboard-title">EDIT STOCKS</h1>
            
            <form id="edit-stocks-form" class="split-grid-layout" onsubmit="preventSubmit(event)">
                <div class="grid-column">
                    <div class="form-group">
                        <label>SLIM GALLON:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="slim-gallon" onkeydown="checkEnter(event, 'slim-gallon')">
                            <button type="button" class="delete-action" onclick="editStock('slim-gallon')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ROUND GALLON:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="round-gallon" onkeydown="checkEnter(event, 'round-gallon')">
                            <button type="button" class="delete-action" onclick="editStock('round-gallon')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 350ML:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="bottled-350ml" onkeydown="checkEnter(event, 'bottled-350ml')">
                            <button type="button" class="delete-action" onclick="editStock('bottled-350ml')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 500ML:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="bottled-500ml" onkeydown="checkEnter(event, 'bottled-500ml')">
                            <button type="button" class="delete-action" onclick="editStock('bottled-500ml')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 1L:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="bottled-1l" onkeydown="checkEnter(event, 'bottled-1l')">
                            <button type="button" class="delete-action" onclick="editStock('bottled-1l')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>SLIM GALLON SMALL CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="slim-small-cap" onkeydown="checkEnter(event, 'slim-small-cap')">
                            <button type="button" class="delete-action" onclick="editStock('slim-small-cap')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>SLIM GALLON BIG CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="slim-big-cap" onkeydown="checkEnter(event, 'slim-big-cap')">
                            <button type="button" class="delete-action" onclick="editStock('slim-big-cap')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ROUND GALLON CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="round-cap" onkeydown="checkEnter(event, 'round-cap')">
                            <button type="button" class="delete-action" onclick="editStock('round-cap')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 350ML CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="bottled-350ml-cap" onkeydown="checkEnter(event, 'bottled-350ml-cap')">
                            <button type="button" class="delete-action" onclick="editStock('bottled-350ml-cap')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 500ML CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="bottled-500ml-cap" onkeydown="checkEnter(event, 'bottled-500ml-cap')">
                            <button type="button" class="delete-action" onclick="editStock('bottled-500ml-cap')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 1L CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="bottled-1l-cap" onkeydown="checkEnter(event, 'bottled-1l-cap')">
                            <button type="button" class="delete-action" onclick="editStock('bottled-1l-cap')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>
                </div>

                <div class="grid-column">
                    <div class="form-group">
                        <label>SEAL:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="seal" onkeydown="checkEnter(event, 'seal')">
                            <button type="button" class="delete-action" onclick="editStock('seal')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>STICKER:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="sticker" onkeydown="checkEnter(event, 'sticker')">
                            <button type="button" class="delete-action" onclick="editStock('sticker')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>GALLON PLASTIC:</label>
                        <div class="input-action-wrapper">
                            <input type="number" min="0" placeholder="0" data-stock="gallon-plastic" onkeydown="checkEnter(event, 'gallon-plastic')">
                            <button type="button" class="delete-action" onclick="editStock('gallon-plastic')">
                                <img src="../images/edit_icon.png" alt="Edit" class="edit-icon-img">
                            </button>
                        </div>
                    </div>
                </div>
            </form>
    </main>            
    <script>
        const BackButton = document.getElementById('BackButton');
        const HomeButton = document.getElementById('HomeButton');


        BackButton.addEventListener('click', function() {
            window.location.href = 'inventory_management_system.html';
        });


        HomeButton.addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
    <script src="../js/edit_stocks.js"></script>
</body>
</html>
