<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMV Water Refilling Station - Add Stocks</title>
    <link rel="stylesheet" href="css/add_stocks.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="stocks-container">
        <header class="top-nav">
            <div class="nav-left">
                <button type="button" id="BackButton" class="back-link">
                    <svg class="nav-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <img src="images/water_logo.png" class="mini-logo" alt="Station Logo">
            </div>
            <button type="button" id="HomeButton" class="home-link">
               <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
        </header>

        <main class="content-wrapper">
            <h1 class="dashboard-title">ADD STOCKS</h1>

            <div class="split-grid-layout">
                <div class="grid-column">
                    <div class="form-group">
                        <label>SLIM GALLON:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="slim_gallon_input" data-stock="slim-gallon" onkeydown="checkEnter(event, 'slim-gallon')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('slim-gallon')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ROUND GALLON:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="round_gallon_input" data-stock="round-gallon" onkeydown="checkEnter(event, 'round-gallon')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('round-gallon')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 350ML:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="bottled_350_input" data-stock="bottled-350ml" onkeydown="checkEnter(event, 'bottled-350ml')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('bottled-350ml')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 500ML:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="bottled_500_input" data-stock="bottled-500ml" onkeydown="checkEnter(event, 'bottled-500ml')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('bottled-500ml')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 1L:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="bottled_1l_input" data-stock="bottled-1l" onkeydown="checkEnter(event, 'bottled-1l')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('bottled-1l')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>SLIM GALLON SMALL CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="slim_small_cap_input" data-stock="slim-small-cap" onkeydown="checkEnter(event, 'slim-small-cap')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('slim-small-cap')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>SLIM GALLON BIG CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="slim_big_cap_input" data-stock="slim-big-cap" onkeydown="checkEnter(event, 'slim-big-cap')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('slim-big-cap')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ROUND GALLON CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="round_cap_input" data-stock="round-cap" onkeydown="checkEnter(event, 'round-cap')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('round-cap')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 350ML CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="bottled_350_cap_input" data-stock="bottled-350ml-cap" onkeydown="checkEnter(event, 'bottled-350ml-cap')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('bottled-350ml-cap')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 500ML CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="bottled_500_cap_input" data-stock="bottled-500ml-cap" onkeydown="checkEnter(event, 'bottled-500ml-cap')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('bottled-500ml-cap')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 1L CAP:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="bottled_1l_cap_input" data-stock="bottled-1l-cap" onkeydown="checkEnter(event, 'bottled-1l-cap')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('bottled-1l-cap')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>
                </div>

                <div class="grid-column">
                    <div class="form-group">
                        <label>SEAL:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="seal_input" data-stock="seal" onkeydown="checkEnter(event, 'seal')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('seal')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>STICKER:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="sticker_input" data-stock="sticker" onkeydown="checkEnter(event, 'sticker')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('sticker')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                                            <div class="form-group">
                        <label>GALLON PLASTIC:</label>
                        <div class="input-action-wrapper">
                            <input type="number" id="gallon_plastic_input" data-stock="gallon-plastic" onkeydown="checkEnter(event, 'gallon-plastic')" min="0" placeholder="0">
                            <button type="button" class="delete-action" onclick="addStock('gallon-plastic')">
                                <img src="images/add_icon.png" class="delete-icon-img" style="pointer-events: none;" alt="Add">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    const BackButton = document.getElementById('BackButton');
    const HomeButton = document.getElementById('HomeButton');
    
    BackButton.addEventListener('click', function() {
        window.location.href = 'inventory_management_system.html';
    });
    
    HomeButton.addEventListener('click', function() {
        window.location.href = 'index.html';
    });
    </script>
    <script src="js/add_stocks.js"></script>
</body>
</html>
