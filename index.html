<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMV Water Refilling Station - System Home</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="home-container">
        <header class="home-header-card">
            <img src="images/water_logo.png" alt="RMV Logo" class="home-logo-circle">
            <h1 class="home-main-title">Web-Based Point-of-Sales and <br> Management System for RMV <br> Water Refilling Station</h1>
        </header>

        <main class="home-menu-stack">
            <button class="btn-home-menu" id="POSButton">
                <img src="images/cart_icon.png" alt="" class="home-icon-img">
                <span class="home-btn-text">POINT OF SALES</span>
            </button>

            <button class="btn-home-menu" id="InventoryButton">
                <img src="images/box_icon.png" alt="" class="home-icon-img">
                <span class="home-btn-text">INVENTORY MANAGEMENT SYSTEM</span>
            </button>

            <button class="btn-home-menu" id="SalesButton">
                <img src="images/view_icon.png" alt="" class="home-icon-img">
                <span class="home-btn-text">VIEW SALES SUMMARY</span>
            </button>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
