<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMV Water Refilling Station - Available Stocks</title>
    <link rel="stylesheet" href="../css/view_available_stocks.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="stocks-container">
        
        <header class="top-nav">
            <div class="nav-left">
                <button id="BackButton" class="back-link">
                    <svg class="nav-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <img src="../images/water_logo.png" alt="Logo" class="mini-logo">
            </div>
            <button id="HomeButton" class="home-link">
                <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
        </header>

        <div class="content-wrapper">
            <h1 class="dashboard-title">AVAILABLE STOCKS</h1>
            
            <div class="split-grid-layout">
                <div class="grid-column">
                    <div class="form-group">
                        <label>SLIM GALLON:</label>
                        <input type="text" id="qty-slim-gallon" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>ROUND GALLON:</label>
                        <input type="text" id="qty-round-gallon" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 350ML:</label>
                        <input type="text" id="qty-bottled-350ml" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 500ML:</label>
                        <input type="text" id="qty-bottled-500ml" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 1L:</label>
                        <input type="text" id="qty-bottled-1l" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>SLIM GALLON SMALL CAP:</label>
                        <input type="text" id="qty-slim-small-cap" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>SLIM GALLON BIG CAP:</label>
                        <input type="text" id="qty-slim-big-cap" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>ROUND GALLON CAP:</label>
                        <input type="text" id="qty-round-cap" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 350ML CAP:</label>
                        <input type="text" id="qty-bottled-350ml-cap" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 500ML CAP:</label>
                        <input type="text" id="qty-bottled-500ml-cap" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>BOTTLED WATER 1L CAP:</label>
                        <input type="text" id="qty-bottled-1l-cap" value="0" disabled>
                    </div>
                </div>

                <div class="grid-column">
                    <div class="form-group">
                        <label>SEAL:</label>
                        <input type="text" id="qty-seal" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>STICKER:</label>
                        <input type="text" id="qty-sticker" value="0" disabled>
                    </div>

                    <div class="form-group">
                        <label>GALLON PLASTIC:</label>
                        <input type="text" id="qty-gallon-plastic" value="0" disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>            
    <script>
        const BackButton = document.getElementById('BackButton');
        const HomeButton = document.getElementById('HomeButton');


        BackButton.addEventListener('click', function() {
            window.location.href = 'inventory_management_system.html';
        });


        HomeButton.addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
    <script src="../js/view_available_stocks.js"></script>
</body>
</html>
