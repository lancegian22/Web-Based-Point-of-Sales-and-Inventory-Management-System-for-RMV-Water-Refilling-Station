<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMV Water Refilling Station - Quantity Edited</title>
    <link rel="stylesheet" href="../css/quantity_edited.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2 family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="stocks-container">
        <nav class="top-nav">
            <div class="nav-left">
                <img src="../images/water_logo.png" alt="RMV Logo" class="mini-logo">
            </div>
        </nav>

        <div class="content-wrapper center-screen-adjustment">
            <div class="status-icon-wrapper">
                <img src="../images/quantity_edited.png" alt="Updated" class="success-box-image">
            </div>
            <h2 class="success-message-text">Quantity Updated Successfully!</h2>
            <button type="button" class="confirm-ok-btn" onclick="redirectToDashboard()">OK</button>
        </div>
    </div>

    <script src="js/quantity_edited.js"></script>
</body>
</html>
